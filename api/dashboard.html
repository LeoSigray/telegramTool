<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>telegramTool — аналитика</title>
<style>
  :root{
    --bg:#0f1216; --panel:#161a21; --line:#242a34; --tx:#e6e9ef; --dim:#8b95a5;
    --ok:#3ddc97; --warn:#ffb454; --bad:#ff6b6b; --acc:#5aa9ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
       font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
         padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
  h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}
  .sp{flex:1}
  input,select,button{background:#0d1015;border:1px solid var(--line);color:var(--tx);
       border-radius:7px;padding:7px 10px;font-size:13px;font-family:inherit}
  button{cursor:pointer}
  button:hover{border-color:var(--acc)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
  main{padding:20px;max-width:1400px;margin:0 auto}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 16px}
  .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.7px}
  .v{font-size:26px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums}
  .sub{color:var(--dim);font-size:12px;margin-top:3px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:11px;
         padding:16px 18px;margin-bottom:18px}
  .panel h2{font-size:13px;margin:0 0 14px;font-weight:600;color:var(--dim);
            text-transform:uppercase;letter-spacing:.7px}
  .two{display:grid;gap:18px;grid-template-columns:1fr 1fr}
  @media(max-width:900px){.two{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--dim);font-weight:500;font-size:11px;
     text-transform:uppercase;letter-spacing:.5px;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:7px 8px;border-bottom:1px solid #1c212a;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  .bar{height:9px;border-radius:5px;background:#0d1015;overflow:hidden}
  .bar>span{display:block;height:100%;background:var(--acc)}
  .funnel-row{display:grid;grid-template-columns:130px 1fr 90px;gap:10px;align-items:center;margin-bottom:9px}
  .funnel-row .lbl{color:var(--dim);font-size:12px}
  .funnel-row .num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{padding:2px 8px;border-radius:20px;font-size:11px;border:1px solid var(--line)}
  .pill.ok{color:var(--ok);border-color:#1e4d3a}
  .pill.warn{color:var(--warn);border-color:#5c452a}
  .pill.bad{color:var(--bad);border-color:#5c2b2b}
  .ci{position:relative;height:18px;background:#0d1015;border-radius:4px}
  .ci>i{position:absolute;top:4px;height:10px;background:#2b4a6b;border-radius:3px}
  .ci>b{position:absolute;top:1px;width:2px;height:16px;background:var(--acc)}
  .muted{color:var(--dim)}
  .warnbox{background:#241d12;border:1px solid #5c452a;color:var(--warn);
           padding:10px 14px;border-radius:9px;margin-bottom:14px;font-size:13px}
  code{background:#0d1015;padding:1px 5px;border-radius:4px;font-size:12px}
</style>
</head>
<body>

<header>
  <h1>telegramTool · аналитика</h1>
  <span id="live" class="muted"><span class="dot" style="background:var(--dim)"></span>нет данных</span>
  <span class="sp"></span>
  <select id="niche"><option value="">все ниши</option></select>
  <select id="days">
    <option value="7">7 дней</option>
    <option value="14">14 дней</option>
    <option value="30" selected>30 дней</option>
    <option value="90">90 дней</option>
  </select>
  <input id="token" type="password" placeholder="API_TOKEN" style="width:180px">
  <button id="save">Подключить</button>
</header>

<main>
  <div id="warns"></div>

  <div class="grid" id="kpi"></div>

  <div class="two">
    <div class="panel">
      <h2>Воронка</h2>
      <div id="funnel"></div>
    </div>
    <div class="panel">
      <h2>Динамика по дням</h2>
      <canvas id="chart" height="220" style="width:100%"></canvas>
      <div class="sub" style="margin-top:8px">
        <span style="color:var(--acc)">■</span> отправлено
        <span style="color:var(--ok);margin-left:12px">■</span> ответов
        <span style="color:var(--bad);margin-left:12px">■</span> ошибок
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>A/B текстов — вероятность ответа</h2>
    <div id="tpl"></div>
  </div>

  <div class="panel">
    <h2>Аккаунты</h2>
    <div id="acc"></div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
let TOKEN = localStorage.getItem('tt_token') || '';
$('#token').value = TOKEN;

$('#save').onclick = () => {
  TOKEN = $('#token').value.trim();
  localStorage.setItem('tt_token', TOKEN);
  refresh();
};
$('#niche').onchange = refresh;
$('#days').onchange = refresh;

async function api(path){
  const r = await fetch(path, {headers:{Authorization:'Bearer '+TOKEN}});
  if(!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0,120));
  return r.json();
}

const fmt = n => (n==null?'—':Number(n).toLocaleString('ru-RU'));
const pct = n => (n==null?'—':(n*100).toFixed(1)+'%');
const money = n => (n==null?'—':Number(n).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽');

function setLive(ok, msg){
  $('#live').innerHTML = '<span class="dot" style="background:'+
    (ok?'var(--ok)':'var(--bad)')+'"></span>'+msg;
}

function kpi(ov){
  const f = ov.funnel, c = ov.cpl, cap = ov.capacity;
  const cards = [
    ['Отправлено', fmt(f.sent), f.pending+' ждут ответа'],
    ['Reply rate', pct(f.reply_rate), f.replied+' ответов'],
    ['Лидов', fmt(f.leads), f.leads? pct(f.lead_rate)+' от отправленных' : 'CRM ещё не размечает'],
    ['Цена лида', money(c.cpl_actual ?? c.cpl_modeled),
      c.cpl_actual? 'фактическая' : 'модельная оценка'],
    ['Ёмкость сегодня', fmt(cap.remaining_today),
      cap.accounts_active+' активных, '+cap.accounts_resting+' отдыхают'],
    ['Цена сообщения', money(ov.cost_per_message.cost_per_message),
      ov.cost_per_message.is_estimate? 'оценка (нет истории)' :
      'по '+ov.cost_per_message.observations+' выбывшим'],
  ];
  $('#kpi').innerHTML = cards.map(([k,v,s]) =>
    `<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="sub">${s}</div></div>`
  ).join('');
}

function funnel(f){
  const max = Math.max(f.attempted,1);
  const rows = [
    ['Попыток', f.attempted, 'var(--dim)'],
    ['Доставлено', f.sent, 'var(--acc)'],
    ['Пропущено', f.skipped, 'var(--warn)'],
    ['Ошибок', f.failed, 'var(--bad)'],
    ['Ответили', f.replied, 'var(--ok)'],
    ['Отказы', f.negative, 'var(--bad)'],
    ['Лиды', f.leads, 'var(--ok)'],
  ];
  $('#funnel').innerHTML = rows.map(([l,n,col]) =>
    `<div class="funnel-row"><div class="lbl">${l}</div>
     <div class="bar"><span style="width:${(n/max*100).toFixed(1)}%;background:${col}"></span></div>
     <div class="num">${fmt(n)}</div></div>`).join('');
}

function chart(series){
  const cv = $('#chart'), dpr = window.devicePixelRatio||1;
  const W = cv.clientWidth, H = 220;
  cv.width = W*dpr; cv.height = H*dpr;
  const g = cv.getContext('2d'); g.scale(dpr,dpr);
  g.clearRect(0,0,W,H);
  if(!series.length){ g.fillStyle='#8b95a5'; g.font='13px sans-serif';
    g.fillText('нет данных за период',12,30); return; }

  const pad = {l:36,r:10,t:12,b:24};
  const max = Math.max(1, ...series.map(d=>Math.max(d.sent||0,d.replied||0,d.failed||0)));
  const x = i => pad.l + i*((W-pad.l-pad.r)/Math.max(1,series.length-1));
  const y = v => H-pad.b - (v/max)*(H-pad.t-pad.b);

  g.strokeStyle='#242a34'; g.lineWidth=1; g.fillStyle='#8b95a5'; g.font='10px sans-serif';
  for(let i=0;i<=4;i++){
    const v = Math.round(max*i/4), yy = y(v);
    g.beginPath(); g.moveTo(pad.l,yy); g.lineTo(W-pad.r,yy); g.stroke();
    g.fillText(v, 6, yy+3);
  }
  const draw = (key,col) => {
    g.strokeStyle=col; g.lineWidth=2; g.beginPath();
    series.forEach((d,i)=>{ const p=[x(i),y(d[key]||0)];
      i?g.lineTo(...p):g.moveTo(...p); });
    g.stroke();
    g.fillStyle=col;
    series.forEach((d,i)=>{ g.beginPath(); g.arc(x(i),y(d[key]||0),2.5,0,7); g.fill(); });
  };
  draw('sent','#5aa9ff'); draw('replied','#3ddc97'); draw('failed','#ff6b6b');

  g.fillStyle='#8b95a5';
  series.forEach((d,i)=>{ if(i%Math.ceil(series.length/6)===0)
    g.fillText(d.d.slice(5), x(i)-12, H-8); });
}

function templates(data){
  const t = data.templates||[];
  if(!t.length){ $('#tpl').innerHTML =
    '<div class="muted">Шаблонов нет. Заведите 2–3 варианта на нишу: '+
    '<code>POST /analytics/templates</code> — тогда бандит начнёт их сравнивать.</div>'; return; }
  const wp = data.win_probability||{};
  const maxHi = Math.max(0.05, ...t.map(x=>x.ci_high));
  $('#tpl').innerHTML = `<table><thead><tr>
    <th>Ниша</th><th>Вар.</th><th>Текст</th><th>Отправлено</th><th>Ответов</th>
    <th style="width:170px">Reply rate (90% интервал)</th><th>Оценка</th><th>P(лучший)</th>
    </tr></thead><tbody>` + t.map(x=>{
      const lo = x.ci_low/maxHi*100, hi = x.ci_high/maxHi*100, m = x.mean/maxHi*100;
      const p = wp[x.variant];
      return `<tr>
        <td class="muted">${x.niche}</td>
        <td><b>${x.variant}</b></td>
        <td class="muted" title="${(x.text||'').replace(/"/g,'&quot;')}">${(x.text||'').slice(0,46)}${x.text.length>46?'…':''}</td>
        <td>${fmt(x.sent)}</td>
        <td>${fmt(x.replies)}</td>
        <td><div class="ci"><i style="left:${lo}%;width:${Math.max(1,hi-lo)}%"></i>
            <b style="left:${m}%"></b></div></td>
        <td>${pct(x.mean)} ${x.enough_data?'':'<span class="pill warn">мало данных</span>'}</td>
        <td>${p==null?'—':pct(p)}</td></tr>`;
    }).join('') + '</tbody></table>' +
    ((data.prune_suggestions||[]).length ?
      '<div class="warnbox" style="margin-top:14px">Кандидаты на отключение: '+
      data.prune_suggestions.map(s=>`<b>${s.variant}</b> (${pct(s.reply_rate)} против ${pct(s.leader_reply_rate)} у ${s.leader_variant})`).join(', ')+
      '</div>' : '');
}

function accounts(d){
  const a = d.accounts||[];
  if(!a.length){ $('#acc').innerHTML='<div class="muted">Аккаунтов нет.</div>'; return; }
  const badge = s => s==='active' ? '<span class="pill ok">активен</span>'
    : s==='resting' ? '<span class="pill warn">отдыхает</span>'
    : '<span class="pill bad">выбыл</span>';
  $('#acc').innerHTML = `<table><thead><tr>
    <th>Аккаунт</th><th>Статус</th><th>Возраст</th><th>Лимит сегодня</th>
    <th>Отправлено</th><th>Осталось</th><th>Множитель</th><th>Ошибки 3д</th><th>Всего за жизнь</th>
    </tr></thead><tbody>` + a.map(x=>`<tr>
      <td>${x.account}</td><td>${badge(x.status)}</td>
      <td class="muted">${x.age_days} д</td>
      <td>${x.daily_cap}</td><td>${x.sent_today}</td><td>${x.remaining_today}</td>
      <td class="${x.cap_multiplier<1?'':''}" style="color:${x.cap_multiplier<0.8?'var(--warn)':'inherit'}">×${x.cap_multiplier}</td>
      <td style="color:${x.error_rate_3d>0.1?'var(--bad)':'inherit'}">${pct(x.error_rate_3d)}</td>
      <td class="muted">${fmt(x.lifetime_sends)}</td></tr>`).join('') +
    `</tbody></table><div class="sub" style="margin-top:10px">
      База ${d.config.base_daily}/день, потолок ${d.config.hard_cap}. Множитель падает вдвое
      при FloodWait/PeerFlood и восстанавливается на 10% за чистый день.</div>`;
}

async function refresh(){
  if(!TOKEN){ setLive(false,'введите API_TOKEN'); return; }
  const n = $('#niche').value, days = $('#days').value;
  const q = (n? '&niche='+encodeURIComponent(n) : '');
  try{
    const [ov, ts, tpl, acc] = await Promise.all([
      api(`/analytics/overview?days=${days}${q}`),
      api(`/analytics/timeseries?days=${days}${q}`),
      api(`/analytics/templates?${n?'niche='+encodeURIComponent(n):''}`),
      api('/analytics/accounts'),
    ]);
    if($('#niche').options.length <= 1 && ov.niches.length)
      ov.niches.forEach(x=>$('#niche').add(new Option(x,x)));

    kpi(ov); funnel(ov.funnel); chart(ts); templates(tpl); accounts(acc);

    const w = [];
    if(ov.cpl.note) w.push(ov.cpl.note);
    if(!ov.capacity.accounts_active) w.push('Нет активных аккаунтов — рассылка не пойдёт.');
    if(ov.cost_per_message.is_estimate && ov.totals.spend===0)
      w.push('Стоимость аккаунтов не задана — CPL считается неверно. POST /analytics/accounts/{name}/cost');
    $('#warns').innerHTML = w.map(x=>`<div class="warnbox">${x}</div>`).join('');

    setLive(true, 'обновлено '+new Date().toLocaleTimeString('ru-RU'));
  }catch(e){ setLive(false, 'ошибка: '+e.message); }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
