<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Клиент в один клик</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face{font-family:"Inter";font-style:normal;font-weight:400 700;font-display:swap;src:url(static/inter-cyrillic.woff2) format("woff2");
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Inter";font-style:normal;font-weight:400 700;font-display:swap;src:url(static/inter-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg1:#F4F8FF;--bg2:#DCEAFF;--glow:rgba(60,155,255,.42);
  --ink:#0B1B33;--ink2:#51627E;--ink3:#7C8CA6;
  --blue:#0A7CFF;--blue-ink:#0663D6;--blue-soft:rgba(10,124,255,.12);
  --glass:rgba(255,255,255,.58);--glass-b:rgba(255,255,255,.75);--glass-hi:rgba(255,255,255,.95);
  --card:rgba(255,255,255,.86);--card-b:rgba(255,255,255,.9);--line:rgba(11,27,51,.08);
  --ok:#0B7A3E;--ok-bg:#E1F5E8;--bad:#B42318;--bad-bg:#FCE8E9;--muted-bg:rgba(11,27,51,.07);
  --shadow:rgba(20,60,140,.14);--scrim:rgba(11,27,51,.32);
  --bubble-in:rgba(255,255,255,.96);--bubble-in-b:rgba(11,27,51,.05);
  --safe-top:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));
  --safe-bottom:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg1:#0A1424;--bg2:#102340;--glow:rgba(47,123,255,.32);
  --ink:#EAF2FF;--ink2:#A9B8D0;--ink3:#7384A3;
  --blue:#3C93FF;--blue-ink:#6AB0FF;--blue-soft:rgba(60,147,255,.16);
  --glass:rgba(28,44,72,.55);--glass-b:rgba(255,255,255,.14);--glass-hi:rgba(255,255,255,.22);
  --card:rgba(22,36,60,.82);--card-b:rgba(255,255,255,.08);--line:rgba(255,255,255,.08);
  --ok:#34C77B;--ok-bg:rgba(52,199,123,.14);--bad:#FF6B70;--bad-bg:rgba(255,107,112,.14);--muted-bg:rgba(255,255,255,.08);
  --shadow:rgba(0,0,0,.35);--scrim:rgba(0,0,0,.5);
  --bubble-in:rgba(255,255,255,.11);--bubble-in-b:rgba(255,255,255,.08);
  color-scheme:dark;
}
:root[data-theme="dark"] .ava{background:rgba(60,147,255,.2);color:#8CC2FF}
:root[data-theme="dark"] .ava.t1{background:rgba(45,200,170,.18);color:#6FE0C8}
:root[data-theme="dark"] .ava.t2{background:rgba(140,125,255,.2);color:#B5ABFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%) fixed;color:var(--ink);
  font-family:"Inter",-apple-system,"SF Pro Text","Segoe UI",system-ui,Roboto,sans-serif;
  font-size:17px;line-height:1.35;overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit}
.glow{position:fixed;border-radius:50%;pointer-events:none;z-index:0}
.glow.a{top:-80px;right:-100px;width:320px;height:320px;background:radial-gradient(circle,var(--glow) 0%,transparent 68%)}
.glow.b{top:24%;left:50%;width:440px;height:440px;margin-left:-220px;background:radial-gradient(circle,var(--glow) 0%,transparent 66%)}
.glow.c{bottom:-40px;left:-120px;width:320px;height:320px;background:radial-gradient(circle,var(--glow) 0%,transparent 68%)}
.screen{position:fixed;inset:0;z-index:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 108px)}
.screen[hidden]{display:none}
h1.title{margin:4px 4px 16px;font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.4px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--glass-b);box-shadow:0 10px 32px var(--shadow),inset 0 1px 0 var(--glass-hi)}
.card{background:var(--card);border:1px solid var(--card-b);border-radius:24px;box-shadow:0 2px 14px rgba(20,60,140,.08)}

/* Главная */
#home{display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.plaque{position:relative;width:min(76vw,290px);height:58px;border-radius:29px;flex:none;
  background:rgba(255,255,255,.34);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);
  border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
:root[data-theme="dark"] .plaque{background:rgba(28,44,72,.5);border-color:rgba(255,255,255,.12);box-shadow:none}
.plaque .txt{position:absolute;left:0;right:0;top:11px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;line-height:20px;font-weight:600}
.plaque.single .txt{top:0;bottom:0;font-size:17px}
.plaque .bar{position:absolute;left:26px;right:26px;bottom:11px;height:5px;border-radius:3px;background:var(--line)}
.plaque .bar i{display:block;height:5px;border-radius:3px;background:var(--blue);transition:width .4s}
.plaque.off .txt{color:var(--ink2)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;width:100%;min-height:360px}
.orb-wrap{position:relative;width:min(70vw,280px);aspect-ratio:1/1;border:0;background:none;padding:0;cursor:pointer;transition:transform .16s ease}
.orb-wrap:active{transform:scale(.96)}
.orb-wrap:focus-visible{outline:3px solid var(--blue);outline-offset:10px;border-radius:50%}
.orb-halo{position:absolute;inset:-6.5%;border-radius:50%;border:1.5px solid rgba(10,124,255,.2)}
.orb{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;
  background:radial-gradient(circle at 50% 36%,#5AA9FF 0%,#1B86FF 48%,#0A5FDB 100%);border:2px solid rgba(255,255,255,.7);
  box-shadow:0 30px 60px rgba(10,100,255,.38),inset 0 -24px 44px rgba(0,60,170,.38),inset 0 12px 26px rgba(255,255,255,.45)}
.orb::before{content:"";position:absolute;inset:5.7%;border-radius:50%;border:1.5px solid rgba(255,255,255,.32)}
.orb::after{content:"";position:absolute;top:8%;left:15.7%;width:46%;height:27%;border-radius:50%;transform:rotate(-24deg);
  background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.75) 0%,rgba(255,255,255,0) 72%)}
.orb.gray{color:#3F5070;background:radial-gradient(circle at 50% 36%,#FAFCFE 0%,#E6ECF5 52%,#CDD6E4 100%);border-color:rgba(255,255,255,.85);
  box-shadow:0 26px 52px rgba(60,80,120,.2),inset 0 -22px 40px rgba(100,120,150,.22),inset 0 12px 26px rgba(255,255,255,.85)}
.orb.gray::before{border-color:rgba(255,255,255,.7)}
.orb.live{color:var(--ink);background:radial-gradient(circle at 50% 36%,#FFFFFF 0%,#EAF3FF 58%,#CCE2FF 100%);border-color:rgba(255,255,255,.9);
  box-shadow:0 28px 56px rgba(10,100,255,.26),inset 0 -22px 40px rgba(10,100,255,.16),inset 0 12px 26px rgba(255,255,255,.9)}
.orb.live::before,.orb.live::after{display:none}
:root[data-theme="dark"] .orb.live{color:#0B1B33}
.orb .in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px}
.orb .in svg{width:31%;height:auto}
.orb .lbl{font-size:26px;line-height:30px;font-weight:700;letter-spacing:-.3px}
.orb.gray .lbl{font-size:23px;line-height:28px}
.orb .ring{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.orb .big{font-size:72px;line-height:76px;font-weight:700;letter-spacing:-1px}
.orb .of{font-size:19px;color:#51627E}
.orb .act{margin-top:10px;display:flex;align-items:center;gap:6px;font-size:17px;font-weight:600;color:#0A7CFF}
.hint{font-size:15px;line-height:20px;color:var(--ink2);text-align:center;min-height:20px}

/* Нижняя панель */
.tabs{position:fixed;z-index:5;left:16px;right:16px;bottom:calc(var(--safe-bottom) + 16px);height:64px;border-radius:32px;padding:6px;display:flex;gap:4px}
.tab{flex:1;border:0;background:none;border-radius:26px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;cursor:pointer}
.tab svg{width:24px;height:24px}
.tab span{font-size:12px;line-height:14px;font-weight:600}
.tab.on{background:var(--blue-soft);color:var(--blue)}
.sect{display:flex;align-items:center;gap:9px;margin:2px 4px 9px;font-size:13px;line-height:16px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.transit{margin-bottom:20px}
.tr-row{display:flex;align-items:center;gap:14px;min-height:72px;border-bottom:1px solid var(--line);overflow:hidden}
.tr-row:last-child{border-bottom:0}
.ghost{background-color:var(--muted-bg);background-image:linear-gradient(100deg,transparent 30%,rgba(120,170,255,.32) 50%,transparent 70%);background-size:220% 100%;animation:shimmer 1.5s linear infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-120% 0}}
.tr-ava{flex:none;width:48px;height:48px;border-radius:50%}
.tr-bar{display:block;height:13px;width:52%;border-radius:7px;margin:3px 0 9px}
.tr-row .pv{display:block}
.tr-row .meta{gap:4px;max-width:42%;text-align:right}
.tr-row .tm{display:flex;align-items:center;gap:4px}
.tr-row .tm svg{width:14px;height:14px}
.tr-row .st{font-size:12px;font-weight:600;color:var(--blue)}
.badge.tr{margin-left:-25px;background:var(--card);color:var(--blue);box-shadow:inset 0 0 0 1.5px var(--blue);animation:trpulse 1.6s ease-in-out infinite}
.badge.tr.bump{animation:trbump .5s ease-out}
@keyframes trpulse{50%{box-shadow:inset 0 0 0 1.5px var(--blue),0 0 0 4px rgba(10,124,255,.18)}}
@keyframes trbump{40%{transform:scale(1.5)}100%{transform:scale(1)}}
.badge{position:absolute;top:3px;left:50%;margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--blue);color:#fff;font-size:12px;line-height:18px;font-weight:600;text-align:center}

/* Списки */
.list{padding:0 16px}
.row{display:flex;align-items:center;gap:14px;min-height:72px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;padding:0;cursor:pointer}
.row:last-child{border-bottom:0}
.ava{flex:none;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;background:#D6E8FF;color:#0663D6}
.ava.t1{background:#D3F0EA;color:#0B6B5C}.ava.t2{background:#E3E0FA;color:#4B3FB5}
.grow{min-width:0;flex:1}
.name{font-size:17px;line-height:22px;font-weight:600}
.sub{font-size:15px;line-height:20px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub.new{color:var(--ink);font-weight:600}
.meta{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-size:13px;color:var(--ink2)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--blue)}
.empty{text-align:center;color:var(--ink2);padding:56px 24px}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}

/* Профиль */
.me{display:flex;align-items:center;gap:14px;margin:0 4px 16px}
.me .ava{width:56px;height:56px;font-size:20px;overflow:hidden}
.me .ava img{width:100%;height:100%;object-fit:cover}
.bal{padding:20px;margin-bottom:24px}
.bal .k{font-size:15px;color:var(--ink2)}
.bal .v{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.bal .v b{font-size:40px;line-height:46px;font-weight:700}
.bal .v span{color:var(--ink2)}
h2.sec{margin:0 4px 10px;font-size:22px;line-height:28px;font-weight:600}
.pay{display:flex;align-items:center;justify-content:space-between;min-height:68px;border-bottom:1px solid var(--line)}
.pay:last-child{border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:13px;font-weight:600}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.mut{background:var(--muted-bg);color:var(--ink2)}
.seg{display:flex;gap:4px;padding:4px;border-radius:20px;background:var(--muted-bg)}
.seg button{flex:1;height:40px;border:0;border-radius:16px;background:none;color:var(--ink2);font-size:15px;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 6px var(--shadow)}
.link-row{display:flex;align-items:center;justify-content:space-between;width:100%;height:60px;padding:0 18px;margin-top:16px;border-radius:22px;cursor:pointer;font-size:17px;font-weight:600}

/* Кнопки */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border:0;border-radius:26px;font-size:17px;font-weight:600;cursor:pointer}
.btn.primary{color:#fff;background:linear-gradient(180deg,#3C9BFF 0%,#0A6CFF 100%);box-shadow:0 10px 22px rgba(10,124,255,.32),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.primary:disabled{opacity:.45;box-shadow:none}
.btn.soft{background:var(--blue-soft);color:var(--blue)}
.btn:active{transform:scale(.98)}

/* Нижние окна */
.scrim{position:fixed;inset:0;z-index:10;background:var(--scrim);opacity:0;transition:opacity .25s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:11;left:0;right:0;bottom:0;max-height:92vh;display:flex;flex-direction:column;
  border-radius:32px 32px 0 0;background:var(--card);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  border-top:1px solid var(--glass-b);box-shadow:0 -10px 40px var(--shadow);transform:translateY(105%);transition:transform .32s cubic-bezier(.22,1,.36,1)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0;flex:none}
.sheet .body{overflow-y:auto;padding:12px 20px 16px;flex:1}
.sheet .foot{flex:none;padding:8px 16px calc(var(--safe-bottom) + 16px)}
.sheet .foot.native{display:none}
.sheet h2{margin:4px 0 16px;font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.3px}
textarea{width:100%;min-height:150px;resize:vertical;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  font:inherit;font-size:17px;padding:14px 16px;outline:none}
textarea:focus{border-color:var(--blue)}
.note{margin-top:10px;font-size:15px;color:var(--ink2)}
.note b{color:var(--ink)}
.bubble.ghost{opacity:.8}
.bubble{margin-top:16px;align-self:flex-end;max-width:85%;margin-left:auto;padding:10px 16px;border-radius:20px 20px 6px 20px;color:#fff;
  background:linear-gradient(180deg,#3C9BFF 0%,#0A6CFF 100%);white-space:pre-wrap;word-break:break-word}
.packs{display:flex;gap:10px;margin-top:8px}
.pack{flex:1;position:relative;min-height:128px;border-radius:22px;border:1px solid var(--card-b);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:12px 4px}
.pack.on{border:2px solid var(--blue);background:var(--blue-soft)}
.pack b{font-size:28px;line-height:32px;font-weight:700}
.pack small{font-size:13px;color:var(--ink2)}
.pack .price{margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:17px;font-weight:600;white-space:nowrap}
.pack .price.usdt{font-size:15px}
.star{width:20px;height:20px;flex:none}
.pack .tag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);height:22px;padding:0 10px;border-radius:11px;background:var(--ok);color:#fff;font-size:12px;line-height:22px;font-weight:600;white-space:nowrap}
.cryptobox{margin-top:16px;padding:16px}
.cryptobox .k{font-size:13px;color:var(--ink2)}
.copyrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:6px;padding:12px 14px;border:1px dashed var(--blue);border-radius:16px;background:var(--blue-soft);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.copyrow b{min-width:0;font-size:20px;line-height:24px;font-weight:700;word-break:break-all}
.copyrow.addr b{font-size:15px;line-height:20px;font-weight:600}
.copyrow span{flex:none;font-size:13px;font-weight:600;color:var(--blue)}
.note.warn{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--bad-bg);color:var(--bad)}
.label{margin:22px 0 10px;font-size:15px;color:var(--ink2)}
.method{display:flex;align-items:center;justify-content:space-between;height:56px;border-bottom:1px solid var(--line);cursor:pointer}
.method:last-child{border-bottom:0}
.method .l{display:flex;align-items:center;gap:12px;font-weight:600}
.method .ic{width:36px;height:36px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center}
.method.off{color:var(--ink2)}.method.off .ic{background:var(--muted-bg);color:var(--ink3)}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--line)}
.radio.on{border:0;background:var(--blue);display:flex;align-items:center;justify-content:center;color:#fff}

/* Окно подарка */
.modal{position:fixed;z-index:12;left:24px;right:24px;top:50%;transform:translateY(-46%) scale(.96);opacity:0;pointer-events:none;
  transition:transform .3s cubic-bezier(.22,1,.36,1),opacity .25s;border-radius:32px;padding:32px 24px 24px;text-align:center;
  background:var(--card);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--glass-b);box-shadow:0 24px 60px rgba(11,27,51,.28)}
.modal.on{opacity:1;transform:translateY(-50%);pointer-events:auto}
.gift{width:104px;height:104px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;
  background:radial-gradient(circle at 50% 36%,#5AA9FF 0%,#1B86FF 48%,#0A5FDB 100%);border:2px solid rgba(255,255,255,.8);
  box-shadow:0 16px 32px rgba(10,100,255,.35),inset 0 -12px 22px rgba(0,60,170,.35),inset 0 8px 16px rgba(255,255,255,.45)}
.modal h2{margin:24px 0 0;font-size:26px;line-height:32px}
.modal p{margin:10px 0 28px;color:var(--ink2);font-size:16px;line-height:22px}

.field{display:block;width:100%;min-height:56px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:17px;padding:0 16px;outline:none}
.field:focus{border-color:var(--blue)}
.err{margin-top:12px;font-size:15px;line-height:20px;font-weight:600;color:var(--bad)}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--blue-soft);border-top-color:var(--blue);animation:spin .9s linear infinite;margin:28px auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:60px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;padding:0}
.kv:last-child{border-bottom:0}
.kv span{color:var(--ink2);font-size:15px;flex:none}
.kv b{min-width:0;flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv i{flex:none;display:flex;color:var(--ink3)}
.fly{position:fixed;left:0;top:0;z-index:7;pointer-events:none;width:34px;height:30px;margin:-15px 0 0 -17px;color:var(--blue);filter:drop-shadow(0 4px 8px var(--shadow));will-change:transform,opacity}
.fly svg{display:block;width:100%;height:100%}
.tab.pop svg{animation:tabpop .45s ease-out}
@keyframes tabpop{40%{transform:scale(1.3)}100%{transform:scale(1)}}
.orb-wrap{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.orb-wrap:disabled{cursor:default}
@media (prefers-reduced-motion:reduce){.tab.pop svg{animation:none}.spin{animation-duration:2s}}

/* Переписка как в обычном мессенджере: шапка сверху, поле ввода внизу, сообщения прижаты к полю ввода */
#chat,#supportScreen,#opsScreen,#opsThread{z-index:6;overflow:hidden;padding:0;background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%)}
.chat-card{display:flex;flex-direction:column;height:100%}
.chat-head{flex:none;display:flex;align-items:center;gap:12px;padding:calc(var(--safe-top) + 10px) 16px 10px;
  background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--line)}
.chat-head .ava{width:40px;height:40px;font-size:15px}
.msgs{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 12px 12px}
.msgs > :first-child{margin-top:auto}
.mrow{display:flex;flex-direction:column;align-items:flex-start;align-self:flex-start;gap:3px;max-width:82%}
.mrow.out{align-items:flex-end;align-self:flex-end}
.msg{max-width:100%;padding:10px 14px;border-radius:20px 20px 20px 6px;background:var(--bubble-in);border:1px solid var(--bubble-in-b);white-space:pre-wrap;word-break:break-word;font-size:17px;line-height:23px}
.msg.out{border-radius:20px 20px 6px 20px;color:#fff;border:0;background:linear-gradient(180deg,#3C9BFF 0%,#0A6CFF 100%)}
.msg[data-mid]{cursor:pointer}
.msg.sel{outline:2px solid var(--blue);outline-offset:2px}
.msg.fail{opacity:.6}
.mt{padding:0 6px;font-size:12px;line-height:16px;color:var(--ink2)}
.mt.bad{color:var(--bad)}
.editbar{flex:none;display:flex;align-items:center;gap:10px;margin:0 10px 8px;padding:8px 8px 8px 12px;border-radius:16px;background:var(--blue-soft)}
.editbar .eb{min-width:0;flex:1;border-left:3px solid var(--blue);padding-left:10px}
.editbar b{display:block;font-size:13px;line-height:16px;color:var(--blue)}
.editbar span{display:block;font-size:15px;line-height:20px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.editbar button{flex:none;width:32px;height:32px;border:0;border-radius:50%;background:none;color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.menu-catch{position:fixed;inset:0;z-index:13}
.menu{position:fixed;z-index:14;min-width:208px;padding:6px;border-radius:20px;background:var(--card);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--glass-b);box-shadow:0 14px 40px var(--shadow)}
.menu button{display:flex;align-items:center;gap:12px;width:100%;height:46px;padding:0 14px;border:0;border-radius:14px;background:none;font-size:17px;font-weight:600;color:var(--ink);text-align:left;cursor:pointer}
.menu button:active{background:var(--blue-soft)}
.menu button.danger{color:var(--bad)}
.composer{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 10px calc(var(--safe-bottom) + 8px);
  background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-top:1px solid var(--line)}
.composer textarea{flex:1;min-height:44px;max-height:140px;border:1px solid var(--card-b);background:var(--card);padding:10px 16px;resize:none;border-radius:22px}
.send{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.send:disabled{background:var(--blue-soft);color:var(--blue)}
.tgtop{flex:none;white-space:nowrap;display:flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 10px;border:0;border-radius:18px;background:var(--blue-soft);color:var(--blue);font:inherit;font-size:14px;line-height:16px;font-weight:600;text-align:left;cursor:pointer}
.tgtop svg{flex:none;width:18px;height:18px}
.tgtop:active{opacity:.7}
.tgonly{flex:1;display:flex;flex-direction:column;gap:8px}
.tgonly p{margin:0;padding:0 6px;font-size:13px;line-height:17px;color:var(--ink2);text-align:center}
.tgwide{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:48px;border:0;border-radius:24px;background:var(--blue);color:#fff;font:inherit;font-size:17px;font-weight:600;cursor:pointer}
.tgwide:disabled{opacity:.5;cursor:default}
.composer .tgonly{display:none}
.composer.only-tg textarea,.composer.only-tg .send{display:none}
.composer.only-tg .tgonly{display:flex}

.backbtn{flex:none;width:36px;height:36px;margin-left:-8px;border:0;border-radius:50%;background:none;color:var(--blue);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ops-tools{flex:none;display:flex;flex-direction:column;gap:8px;padding:10px 12px 10px;border-bottom:1px solid var(--line);background:var(--glass)}
.ops-tools .seg button{height:36px;font-size:14px}
.ops-tools .chips{display:flex;gap:8px}
.chip{flex:none;height:32px;padding:0 13px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.ops-search{display:block;width:100%;height:40px;border-radius:14px;border:1px solid var(--card-b);background:var(--card);color:var(--ink);font:inherit;font-size:16px;padding:0 14px;outline:none}
.ops-search:focus{border-color:var(--blue)}
.ops-list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px calc(var(--safe-bottom) + 12px)}
.ops-list .row{min-height:76px}
.ops-list .row .sub{max-width:100%}
.cnt{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--blue);color:#fff;font-size:12px;line-height:20px;font-weight:700;text-align:center}
.pill.wait{background:var(--blue-soft);color:var(--blue)}
.langscreen{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%)}
.lang-card{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:stretch;gap:12px;text-align:center}
.lang-card svg{align-self:center}
.lang-card h2{margin:12px 0 12px;font-size:28px;line-height:34px;font-weight:700}
.lang-card h2 small{display:block;margin-top:6px;font-size:17px;line-height:22px;font-weight:500;color:var(--ink2)}
.lang-btn{height:60px;justify-content:flex-start;gap:16px;padding:0 22px;font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--card-b);border-radius:20px}
.lang-btn b{width:28px;height:28px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:15px}
.toast{position:fixed;z-index:20;left:50%;top:calc(var(--safe-top) + 12px);transform:translate(-50%,-140%);transition:transform .3s;max-width:calc(100% - 32px);
  padding:12px 18px;border-radius:22px;font-size:15px;font-weight:600;text-align:center}
.toast.on{transform:translate(-50%,0)}
.fatal{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;gap:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (prefers-reduced-transparency:reduce){.glass,.sheet,.modal,.plaque{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--card)}}

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

function esc(s) {

  const f = forms.ru, a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return f[2];
  if (b > 1 && b < 5) return f[1];

}

  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 86400000);
  if (diff === 0) return d.toLocaleTimeString(LOC(), {hour: "2-digit", minute: "2-digit"});

async function api(path, method, body) {
  if (DEMO) return demoApi(path, method || "GET", body);
  const res = await fetch("api/" + path, {
    method: method || "GET",
    headers: {"Content-Type": "application/json", "X-Telegram-Init-Data": tg.initData},
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (e) { data = null; }
  if (!res.ok) {
    const err = new Error(t((data && typeof data.detail === "string" && data.detail) || "Что-то пошло не так, попробуйте ещё раз"));
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

function shownBalance() { return Math.max(0, S.me.balance - S.inflight); }
function shownPending() { return S.me.pending + S.inflight; }
function renderHome() {
  const me = S.me;
  if (!me) return;
  const plaque = $("plaque"), orb = $("orb"), hint = $("hint");
  const gift = me.gift.amount, ch = me.channel, bal = shownBalance(), pend = shownPending();
  const leads = me.leads || {searching: false};
  plaque.className = "plaque";
  if (bal > 0) {
    const giftMode = !me.has_paid && bal <= gift;
    if (giftMode) {
      const label = bal >= gift ? `${gift} ${plural(gift, MSG)}` : t("Осталось {a} из {b}", {a: bal, b: gift});
      plaque.innerHTML = `<div class="txt"><span style="color:var(--blue);display:flex">${ICON.gift}</span>${label}</div><div class="bar"><i style="width:${Math.round(bal / gift * 100)}%"></i></div>`;
    } else {
      plaque.classList.add("single");
      plaque.innerHTML = `<div class="txt"><span style="color:var(--blue);display:flex">${ICON.msg}</span>${fmt(bal)} ${plural(bal, MSG)}</div>`;
    }
  } else {
    plaque.classList.add("off");
    plaque.innerHTML = `<div class="txt">${ICON.check}${t("Сообщения закончились")}</div><div class="bar"></div>`;
  }
  const blue = (icon, label, aria) => {
    orb.innerHTML = `<span class="orb-halo"></span><span class="orb"><span class="in">${icon}<span class="lbl">${label}</span></span></span>`;
    orb.setAttribute("aria-label", aria);
  };
  orb.disabled = false;
  if (!ch || ch.status === "failed") {
    S.orbMode = "channel";
    blue(ICON.link, t("Что продвигаем?"), t("Рассказать, что вы продвигаете"));
    hint.textContent = ch && ch.error ? t(ch.error) : t("Укажите канал, продукт или нишу: остальное сделаем сами");
  } else if (ch.status === "building") {
    S.orbMode = "wait";
    orb.disabled = true;
    orb.innerHTML = `<span class="orb gray"><span class="in"><span class="spin" style="margin:0"></span><span class="lbl">${t(ch.kind === "topic" ? "Готовим текст…" : "Читаем канал…")}</span></span></span>`;
    orb.setAttribute("aria-label", t(ch.kind === "topic" ? "Готовим текст" : "Читаем канал"));
    hint.textContent = t("Это займёт около минуты");
  } else if (bal <= 0) {
    S.orbMode = "topup";
    orb.innerHTML = `<span class="orb-halo" style="border-color:rgba(100,120,150,.2)"></span><span class="orb gray"><span class="in">${ICON.plus}<span class="lbl">${t("Пополнить баланс")}</span></span></span>`;
    orb.setAttribute("aria-label", t("Пополнить баланс"));
    hint.textContent = pend > 0 ? waitHint(pend, leads) : (me.gift.claimed ? t("Пополните баланс, чтобы продолжить") : "");
  } else {
    S.orbMode = "send";
    blue(ICON.send, t("Отправить"), t("Отправить одно сообщение"));
    hint.textContent = pend > 0 ? waitHint(pend, leads)
      : me.sent ? t("Отправлено {n} · ответы в «Чатах»", {n: fmt(me.sent)}) : t("Нажмите: найдём человека под вашу тему и напишем ему");
  }
}

function waitHint(pend, leads) {
  // каждое нажатие — поиск одного человека умным парсингом, потом отправка
  return leads.searching ? t("Ищем человека под вашу тему… в очереди {n}", {n: pend}) : t("Отправляем… в очереди {n}", {n: pend});
}

  const topX = sx + (ex - sx) * 0.25 + jx, topY = Math.min(sy, ey) - o.height * 0.55;
  const midX = sx + (ex - sx) * 0.7 + jx * 0.4, midY = (topY + ey) / 2;
  const el = document.createElement("span");
  el.className = "fly";
  el.innerHTML = FLY_ITEMS[FLY_STYLE];
  document.body.appendChild(el);
  const at = (x, y, sc, rot) => `translate(${x}px,${y}px) scale(${sc}) rotate(${rot}deg)`;
  const anim = el.animate([
    {transform: at(sx, sy, 0.3, -8), opacity: 0, offset: 0},
    {transform: at(topX, topY, 1.15, -4), opacity: 1, offset: 0.3, easing: "cubic-bezier(.4,0,.9,.6)"},
    {transform: at(midX, midY, 0.85, 6), opacity: 1, offset: 0.7},
    {transform: at(ex, ey, 0.3, 10), opacity: 0.9, offset: 1},
  ], {duration: 800, easing: "cubic-bezier(.3,.1,.5,1)", fill: "forwards"});
  const done = () => { el.remove(); pop(); };
  anim.addEventListener("finish", done);
  anim.addEventListener("cancel", () => el.remove());
  setTimeout(() => { if (el.isConnected) done(); }, 1500);
}

  // Время под сообщением: сегодня только часы и минуты, раньше добавляем дату
  if (!iso) return "";
  const d = new Date(iso), hm = d.toLocaleTimeString(LOC(), {hour: "2-digit", minute: "2-digit"});
  const same = d.toDateString() === new Date().toDateString();
  return same ? hm : `${d.toLocaleDateString(LOC(), {day: "numeric", month: "short"})}, ${hm}`;
}

  return `<div class="mrow ${m.out ? "out" : ""}">
    <div class="msg ${m.out ? "out" : ""} ${m.status === "failed" ? "fail" : ""}" ${acts ? `data-mid="${m.id}" tabindex="0" role="button" aria-label="${t("Действия с сообщением")}"` : ""}>${esc(m.text || "")}</div>
    <div class="mt ${m.status === "failed" ? "bad" : ""}">${esc(notes.filter(Boolean).join(" · "))}</div></div>`;
}

const TG_NOTE = "Откроется ваш Telegram: вы напишете человеку со своего аккаунта, а не с того, с которого шла рассылка.";

async function loadChat(scroll) {

    + (S.chatUrl && canReply ? `<button id="tgBtn" class="tgtop" type="button" aria-label="${t("Перейти в Telegram")}">${TGICON}<span>${t("Перейти в Telegram")}</span></button>` : "");

/* Меню сообщения: изменить / удалить (только свои сообщения) */
function closeMsgMenu() {
  $("msgMenu").hidden = true;
  $("menuCatch").hidden = true;
  if (S.menuEl) S.menuEl.classList.remove("sel");
  S.menuEl = null;
}
function openMsgMenu(id, el) {
  const m = (S.chatMsgs || []).find((x) => x.id === id);
  if (!m || !(m.can_edit || m.can_delete)) return;
  closeMsgMenu();
  hap("select");
  const menu = $("msgMenu");
  menu.innerHTML = (m.can_edit ? `<button type="button" role="menuitem" data-act="edit">${ICON.pencil}${t("Изменить")}</button>` : "")
    + (m.can_delete ? `<button type="button" role="menuitem" class="danger" data-act="del">${ICON.trash}${t("Удалить")}</button>` : "");
  menu.hidden = false;
  $("menuCatch").hidden = false;
  el.classList.add("sel");
  S.menuEl = el;
  const r = el.getBoundingClientRect(), rowBottom = el.parentElement.getBoundingClientRect().bottom;
  const w = menu.offsetWidth, h = menu.offsetHeight;
  const left = Math.min(Math.max(12, r.right - w), innerWidth - w - 12);
  let top = rowBottom + 6;                       // ниже пузыря и подписи со временем
  if (top + h > innerHeight - 12) top = Math.max(12, r.top - h - 8);
  menu.style.left = left + "px";
  menu.style.top = top + "px";
  const edit = menu.querySelector('[data-act="edit"]'), del = menu.querySelector('[data-act="del"]');
  if (edit) edit.onclick = () => { closeMsgMenu(); startEdit(m); };
  if (del) del.onclick = () => { closeMsgMenu(); deleteMsg(m); };
}
$("menuCatch").addEventListener("click", closeMsgMenu);
$("msgs").addEventListener("scroll", () => { if (S.menuEl) closeMsgMenu(); });

async function deleteMsg(m) {
  const ok = await confirmBox(t("Удалить сообщение? Оно исчезнет и у собеседника."));
  if (!ok || !S.chatId) return;
  try {
    await api(`chats/${S.chatId}/messages/${m.id}`, "DELETE");
    if (S.editing && S.editing.id === m.id) cancelEdit();
    hap("success");
    toast(t("Сообщение удалено"));
    await loadChat(false);
  } catch (e) { hap("error"); toast(e.message); }
}

/* Режим правки: текст сообщения в поле ввода, над ним плашка «Изменение сообщения» */
const replyText = $("replyText");
function sizeReply() {
  replyText.style.height = "auto";
  replyText.style.height = Math.min(140, replyText.scrollHeight) + "px";
}
function startEdit(m) {
  S.editing = {id: m.id, text: m.text || ""};
  $("editText").textContent = S.editing.text;
  $("editBar").hidden = false;
  replyText.value = S.editing.text;
  $("sendBtn").innerHTML = ICON.tick;
  $("sendBtn").setAttribute("aria-label", t("Сохранить изменения"));
  $("sendBtn").disabled = !replyText.value.trim();
  sizeReply();
  replyText.focus();
}
function cancelEdit() {
  if (!S.editing) return;
  S.editing = null;
  $("editBar").hidden = true;
  replyText.value = "";
  sizeReply();
  $("sendBtn").innerHTML = ICON.up;
  $("sendBtn").setAttribute("aria-label", t("Отправить"));
  $("sendBtn").disabled = true;
}
$("editCancel").addEventListener("click", () => { hap("light"); cancelEdit(); });
replyText.addEventListener("input", () => {
  $("sendBtn").disabled = !replyText.value.trim();
  sizeReply();
});
$("sendBtn").addEventListener("click", async () => {
  const text = replyText.value.trim();
  if (!text || !S.chatId) return;
  if (S.editing) {
    const ed = S.editing;
    if (text === ed.text.trim()) { cancelEdit(); return; }       // ничего не поменяли
    $("sendBtn").disabled = true;
    try {
      await api(`chats/${S.chatId}/messages/${ed.id}`, "PATCH", {text});
      cancelEdit();
      hap("success");
      toast(t("Сообщение изменено"));
      await loadChat(false);
    } catch (e) { hap("error"); toast(e.message); $("sendBtn").disabled = false; }
    return;
  }
  $("sendBtn").disabled = true;
  try {
    await api(`chats/${S.chatId}/reply`, "POST", {text});
    replyText.value = "";
    sizeReply();
    hap("light");
    await loadChat(true);
  } catch (e) { hap("error"); toast(e.message); $("sendBtn").disabled = false; }
});

  Object.assign(DEMO_DB, {lang: "ru", gift_claimed: true, balance: 37, ops: genOps(),
    channel: {handle: "neuro_magic", kind: "channel", status: "ready", text: DEMO_TEXT, error: null}});
  window.addEventListener("load", () => setTimeout(async () => {
    if (!S.me || !S.me.operator) return;
    const v = window.DEMO_OPS_VIEW || {};                    // какой вид показать сразу (для макета)
    Object.assign(S.ops, {order: v.order || "new", filter: v.filter || "all"});
    if (v.dark) { S.themePref = "dark"; applyTheme(); }
    showTab("profile");
    await openOps();
    if (v.open) openOpsThread(v.open);
  }, 1200));
}
function demoPay() {
  const D = DEMO_DB, map = {p200: [200, 350], p500: [500, 800], p1000: [1000, 1400]}, v = map[D.pending] || [500, 800];
  D.balance += v[0];
  D.has_paid = true;
  D.payments.unshift({id: D.seq++, messages: v[0], amount: v[1], status: "paid", created_at: new Date().toISOString(), paid_at: new Date().toISOString()});
}

start();
</script>
