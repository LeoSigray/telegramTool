<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Диалоги</title>
<style>
  /* Та же светлая «стеклянная» тема, что и у дашборда (desktop/.../src/index.html). */
  :root{
    --bg1:#dbe9fc; --bg2:#eef3fb; --bg3:#f7fafd;
    --panel: rgba(255,255,255,.62); --panel-solid:#ffffff;
    --line: rgba(90,130,200,.22); --line-soft: rgba(90,130,200,.14);
    --tx:#16213a; --dim:#5f6f92;
    --ok:#1a9c6b; --warn:#b8790a; --bad:#d43f4f;
    --acc:#3a86ff; --acc-deep:#1a56db; --sub:#7c5cff;
    --glass-blur: 20px;
    --shadow: 0 8px 30px rgba(60,100,180,.14), inset 0 1px 0 rgba(255,255,255,.7);
    --shadow-sm: 0 2px 10px rgba(60,100,180,.10);
    --in-bg: rgba(255,255,255,.85);
    --out-bg: linear-gradient(180deg,#3a86ff,#2f78f0);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;color:var(--tx);overflow:hidden;
       font:14px/1.5 -apple-system,ui-sans-serif,"SF Pro Text","Segoe UI",Roboto,sans-serif;
       background:
         radial-gradient(1100px 700px at 12% -10%, rgba(120,170,255,.35), transparent 60%),
         radial-gradient(900px 650px at 105% 0%, rgba(150,130,255,.22), transparent 55%),
         linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%)}
  .app{display:flex;height:100%}
  button,input,textarea{font-family:inherit}

  /* ── левая колонка: список диалогов ───────────────────────────────── */
  .list{width:340px;flex:none;display:flex;flex-direction:column;min-height:0;
        border-right:1px solid var(--line);
        background:var(--panel);backdrop-filter:blur(var(--glass-blur)) saturate(180%);
        -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%)}
  .list-head{padding:14px 14px 10px;border-bottom:1px solid var(--line-soft)}
  .list-head h1{font-size:14px;margin:0 0 10px;font-weight:700;color:var(--acc-deep);
        text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:8px}
  .list-head h1 .live{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .search{width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 10px;
        font-size:13px;background:rgba(255,255,255,.7);color:var(--tx)}
  .search:focus{outline:none;border-color:var(--acc)}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;
       background:rgba(255,255,255,.45);margin-top:9px}
  .seg button{flex:1;border:none;background:transparent;padding:6px 8px;font-size:12px;
       cursor:pointer;color:var(--dim)}
  .seg button.active{background:var(--acc);color:#fff;font-weight:600}
  .rows{flex:1;overflow-y:auto;min-height:0}
  .row{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;
       padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line-soft)}
  .row:hover{background:rgba(255,255,255,.5)}
  .row.active{background:rgba(58,134,255,.12)}
  .av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
      font-weight:700;color:#fff;font-size:15px;background:var(--sub)}
  .row .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .pv{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .pv.me::before{content:"вы: ";color:var(--acc-deep)}
  .row .rt{color:var(--dim);font-size:11px;text-align:right;white-space:nowrap}
  .badge{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;
      background:var(--acc);color:#fff;border-radius:10px;font-size:11px;font-weight:700;padding:0 5px;margin-top:4px}
  .row .acct{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
  .empty{padding:26px 16px;color:var(--dim);font-size:13px;text-align:center}

  /* ── правая колонка: тред ─────────────────────────────────────────── */
  .thread{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  .th-head{flex:none;padding:12px 18px;border-bottom:1px solid var(--line);
       background:var(--panel);backdrop-filter:blur(var(--glass-blur)) saturate(180%);
       -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);
       display:flex;align-items:center;gap:12px}
  .th-head .nm{font-weight:700;font-size:14px}
  .th-head .meta{color:var(--dim);font-size:12px}
  .th-head .sp{flex:1}
  .chip{font-size:11px;color:var(--acc-deep);border:1px solid var(--line);
       background:rgba(255,255,255,.55);border-radius:20px;padding:3px 9px;white-space:nowrap}
  .th-head button{font-size:12px;border:1px solid var(--line);background:rgba(255,255,255,.65);
       color:var(--tx);border-radius:8px;padding:6px 10px;cursor:pointer}
  .th-head button:hover{border-color:var(--acc)}
  .msgs{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:4px}
  .daysep{align-self:center;font-size:11px;color:var(--dim);background:rgba(255,255,255,.6);
       border:1px solid var(--line-soft);border-radius:20px;padding:2px 10px;margin:10px 0}
  .bub{max-width:70%;padding:8px 12px;border-radius:14px;font-size:13.5px;line-height:1.45;
       box-shadow:var(--shadow-sm);white-space:pre-wrap;word-wrap:break-word;position:relative}
  .bub.in{align-self:flex-start;background:var(--in-bg);border:1px solid var(--line-soft);
       border-bottom-left-radius:5px}
  .bub.out{align-self:flex-end;background:var(--out-bg);color:#fff;border-bottom-right-radius:5px}
  .bub .t{font-size:10px;margin-top:4px;opacity:.7;display:flex;gap:6px;align-items:center}
  .bub.out .t{justify-content:flex-end}
  .bub.deleted{opacity:.5;font-style:italic}
  .bub.failed{background:rgba(212,63,79,.14);color:var(--bad);border:1px solid rgba(212,63,79,.4)}
  .bub .via{font-size:9px;text-transform:uppercase;letter-spacing:.4px;opacity:.65}
  .composer{flex:none;border-top:1px solid var(--line);padding:12px 16px;
       background:var(--panel);backdrop-filter:blur(var(--glass-blur)) saturate(180%);
       -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);
       display:flex;gap:10px;align-items:flex-end}
  .composer textarea{flex:1;resize:none;max-height:140px;min-height:40px;border:1px solid var(--line);
       border-radius:12px;padding:10px 12px;font-size:13.5px;background:rgba(255,255,255,.8);color:var(--tx)}
  .composer textarea:focus{outline:none;border-color:var(--acc)}
  .composer .send{flex:none;background:var(--acc);color:#fff;border:none;border-radius:12px;
       padding:0 18px;height:40px;font-weight:600;font-size:13px;cursor:pointer}
  .composer .send:disabled{opacity:.5;cursor:default}
  .nochat{flex:1;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:14px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
       background:var(--bad);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;
       box-shadow:var(--shadow);max-width:80%;z-index:9;display:none}
  .toast.ok{background:var(--ok)}
  .tokenbox{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
       background:rgba(220,233,252,.75);backdrop-filter:blur(6px);z-index:20}
  .tokenbox .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;
       width:340px;box-shadow:var(--shadow)}
  .tokenbox h2{margin:0 0 6px;font-size:15px}
  .tokenbox p{margin:0 0 14px;color:var(--dim);font-size:12px}
  .tokenbox input{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px}
  .tokenbox button{margin-top:12px;width:100%;background:var(--acc);color:#fff;border:none;
       border-radius:9px;padding:9px;font-weight:600;cursor:pointer}
</style>
</head>
<body>

<div class="app">
  <div class="list">
    <div class="list-head">
      <h1><span class="live" id="live"></span>Диалоги <span id="cnt" class="chip" style="margin-left:auto"></span></h1>
      <input class="search" id="search" placeholder="поиск: имя, @username, id, телефон">
      <div class="seg" id="statusSeg">
        <button data-s="open" class="active">Открытые</button>
        <button data-s="closed">Закрытые</button>
        <button data-s="all">Все</button>
      </div>
    </div>
    <div class="rows" id="rows"><div class="empty">Загрузка…</div></div>
  </div>

  <div class="thread">
    <div id="threadInner" class="nochat">Выберите диалог слева</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="tokenbox" id="tokenbox" style="display:none">
  <div class="card">
    <h2>Нужен API-токен</h2>
    <p>Тот же токен, что у бэкенда (<code>API_TOKEN</code> в .env или ~/.telegramtool/token).</p>
    <input id="tokenInput" type="password" placeholder="API_TOKEN">
    <button id="tokenSave">Подключиться</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const BACKEND = location.origin && location.origin.startsWith('http') ? location.origin : 'http://127.0.0.1:9000';
let TOKEN = '';
let statusFilter = 'open';
let search = '';
let activeId = null;
let convCache = [];
let lastMsgCount = 0;
let sending = false;
let listTimer = null, threadTimer = null;

/* ── токен ────────────────────────────────────────────────────────── */
async function ensureToken(){
  if(TOKEN) return true;
  try{
    const urlTok = new URLSearchParams(location.search).get('token');
    if(urlTok){ TOKEN = urlTok; return true; }
  }catch(e){}
  if(window.__TAURI__){
    try{
      const t = await window.__TAURI__.core.invoke('read_local_token');
      if(t){ TOKEN = t; return true; }
    }catch(e){}
  }
  try{
    const stored = localStorage.getItem('tt_token');
    if(stored){ TOKEN = stored; return true; }
  }catch(e){}
  return false;
}

$('#tokenSave').onclick = () => {
  const v = $('#tokenInput').value.trim();
  if(!v) return;
  TOKEN = v;
  try{ localStorage.setItem('tt_token', v); }catch(e){}
  $('#tokenbox').style.display = 'none';
  boot();
};

/* ── api ──────────────────────────────────────────────────────────── */
async function api(path, opts){
  const r = await fetch(BACKEND + path, {
    ...opts,
    headers: {'Authorization':'Bearer '+TOKEN, 'Content-Type':'application/json', ...(opts && opts.headers)},
  });
  if(r.status === 401){ $('#tokenbox').style.display = 'flex'; throw new Error('401'); }
  if(!r.ok){
    let detail = r.status + '';
    try{ const j = await r.json(); detail = j.detail || detail; }catch(e){}
    throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
  }
  return r.json();
}

/* ── утилиты ──────────────────────────────────────────────────────── */
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function initials(c){
  const n = c.display_name || c.username || c.peer_id || '?';
  return n.replace('@','').slice(0,2).toUpperCase();
}
function avColor(seed){
  const p = ['#7c5cff','#3a86ff','#1a9c6b','#b8790a','#d43f4f','#0ea5a5','#6d28d9'];
  let h = 0; for(const ch of (seed||'')) h = (h*31 + ch.charCodeAt(0)) & 0xffff;
  return p[h % p.length];
}
function relTime(iso){
  if(!iso) return '';
  const d = new Date(iso), now = new Date();
  const diff = (now - d) / 1000;
  if(diff < 60) return 'только что';
  if(diff < 3600) return Math.floor(diff/60) + ' мин';
  if(diff < 86400 && d.getDate() === now.getDate()) return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  if(diff < 604800) return d.toLocaleDateString('ru-RU',{weekday:'short'});
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
}
function dayLabel(iso){
  const d = new Date(iso), now = new Date();
  if(d.toDateString() === now.toDateString()) return 'Сегодня';
  const y = new Date(now); y.setDate(y.getDate()-1);
  if(d.toDateString() === y.toDateString()) return 'Вчера';
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
}
const VIA = {platform:'платформа', telegram:'telegram', broadcast:'рассылка', history:'история'};

function toast(msg, ok){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast' + (ok ? ' ok' : '');
  t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.display = 'none'; }, 3500);
}
function setLive(ok){ $('#live').style.background = ok ? 'var(--ok)' : 'var(--bad)'; }

/* ── список диалогов ──────────────────────────────────────────────── */
async function loadList(){
  try{
    const q = new URLSearchParams({status: statusFilter});
    if(search) q.set('q', search);
    const data = await api('/inbox/conversations?' + q.toString());
    convCache = data.conversations || [];
    renderList();
    const s = data.stats || {};
    $('#cnt').textContent = `${s.open||0} откр · ${s.unread_chats||0} непроч`;
    setLive(true);
  }catch(e){
    setLive(false);
    if(e.message !== '401') $('#rows').innerHTML = `<div class="empty">Ошибка: ${esc(e.message)}</div>`;
  }
}

function renderList(){
  const rows = $('#rows');
  if(!convCache.length){
    rows.innerHTML = `<div class="empty">Пока нет диалогов.<br>Они появятся, когда получатель рассылки ответит.<br><br>
      <button id="seedBtn" style="border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer">Посеять из истории рассылок</button></div>`;
    const b = $('#seedBtn');
    if(b) b.onclick = async () => {
      b.disabled = true; b.textContent = 'Посев…';
      try{ const r = await api('/inbox/backfill', {method:'POST'});
        toast(`Создано диалогов: ${r.conversations_created}`, true); loadList();
      }catch(e){ toast(e.message); b.disabled = false; b.textContent = 'Посеять из истории рассылок'; }
    };
    return;
  }
  rows.innerHTML = convCache.map(c => {
    const name = c.display_name || (c.username ? '@'+c.username : c.peer_id);
    return `<div class="row ${c.id===activeId?'active':''}" data-id="${c.id}">
      <div class="av" style="background:${avColor(c.peer_id)}">${esc(initials(c))}</div>
      <div style="min-width:0">
        <div class="nm">${esc(name)}</div>
        <div class="pv ${c.last_message_from_me?'me':''}">${esc((c.last_message_text||'').slice(0,80))}</div>
        <div class="acct">↔ ${esc(c.account||'')}</div>
      </div>
      <div style="text-align:right">
        <div class="rt">${relTime(c.last_message_at)}</div>
        ${c.unread ? `<div class="badge">${c.unread}</div>` : ''}
      </div>
    </div>`;
  }).join('');
  rows.querySelectorAll('.row').forEach(el => {
    el.onclick = () => openConv(Number(el.dataset.id));
  });
}

/* ── тред ─────────────────────────────────────────────────────────── */
async function openConv(id){
  activeId = id;
  lastMsgCount = 0;
  renderList();
  $('#threadInner').className = '';
  $('#threadInner').innerHTML = '<div class="nochat">Загрузка…</div>';
  await loadThread(true);
  clearInterval(threadTimer);
  threadTimer = setInterval(() => loadThread(false), 4000);
}

async function loadThread(first){
  if(activeId == null) return;
  try{
    const data = await api(`/inbox/conversations/${activeId}?hydrate_history=${first?'true':'false'}`);
    renderThread(data, first);
    if(data.hydrate && data.hydrate.ok === false && first)
      toast('История из Telegram недоступна: ' + data.hydrate.error);
  }catch(e){
    if(e.message !== '401') toast('Не удалось загрузить диалог: ' + e.message);
  }
}

function renderThread(data, first){
  const c = data.conversation, msgs = data.messages || [];
  const inner = $('#threadInner');
  inner.className = 'thread-inner';
  const name = c.display_name || (c.username ? '@'+c.username : c.peer_id);
  const box = $('#msgs');
  const atBottom = box ? (box.scrollHeight - box.scrollTop - box.clientHeight < 60) : true;

  if(first || !$('#msgs')){
    inner.style.display = 'flex';
    inner.style.flexDirection = 'column';
    inner.style.height = '100%';
    inner.innerHTML = `
      <div class="th-head">
        <div class="av" style="width:34px;height:34px;font-size:13px;background:${avColor(c.peer_id)}">${esc(initials(c))}</div>
        <div style="min-width:0">
          <div class="nm">${esc(name)}</div>
          <div class="meta">${c.username?('@'+esc(c.username)+' · '):''}id ${esc(c.peer_id)}${c.phone?(' · '+esc(c.phone)):''}</div>
        </div>
        <div class="sp"></div>
        <span class="chip" title="аккаунт, который ведёт диалог">↔ ${esc(c.account||'')}</span>
        <button id="btnHydrate">↻ история</button>
        <button id="btnStatus">${c.status==='closed'?'Открыть':'Закрыть'}</button>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="composer">
        <textarea id="ta" rows="1" placeholder="Ваш ответ — уйдёт с аккаунта ${esc(c.account||'')}…"></textarea>
        <button class="send" id="btnSend">Отпр.</button>
      </div>`;
    $('#btnHydrate').onclick = async (e) => {
      e.target.disabled = true;
      try{ const r = await api(`/inbox/conversations/${activeId}/hydrate`, {method:'POST'});
        toast(`Подтянуто ${r.added} новых (via ${r.via})`, true); loadThread(false);
      }catch(err){ toast(err.message); }
      e.target.disabled = false;
    };
    $('#btnStatus').onclick = async (e) => {
      const next = c.status === 'closed' ? 'open' : 'closed';
      try{ await api(`/inbox/conversations/${activeId}/status`, {method:'POST', body: JSON.stringify({status: next})});
        loadList(); loadThread(true);
      }catch(err){ toast(err.message); }
    };
    const ta = $('#ta');
    ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 140) + 'px'; });
    ta.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); doSend(); }
    });
    $('#btnSend').onclick = doSend;
  }

  // тело сообщений — перерисовываем только если что-то изменилось
  if(msgs.length !== lastMsgCount || first){
    lastMsgCount = msgs.length;
    const parts = [];
    let lastDay = '';
    for(const m of msgs){
      const day = dayLabel(m.sent_at);
      if(day !== lastDay){ parts.push(`<div class="daysep">${day}</div>`); lastDay = day; }
      const cls = 'bub ' + (m.direction === 'out' ? 'out' : 'in')
        + (m.status === 'deleted' ? ' deleted' : '') + (m.status === 'failed' ? ' failed' : '');
      const time = new Date(m.sent_at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
      const via = m.via && m.via !== 'telegram' ? `<span class="via">${VIA[m.via]||m.via}</span>` : '';
      const err = m.status === 'failed' ? ` · ${esc(m.error||'ошибка')}` : '';
      parts.push(`<div class="${cls}">${esc(m.text) || '<i>[без текста]</i>'}
        <div class="t">${via}<span>${time}${err}</span></div></div>`);
    }
    $('#msgs').innerHTML = parts.join('') || '<div class="nochat" style="margin:auto">Нет сообщений</div>';
  }
  if(atBottom){ const b = $('#msgs'); if(b) b.scrollTop = b.scrollHeight; }
}

async function doSend(){
  if(sending || activeId == null) return;
  const ta = $('#ta');
  const text = ta.value.trim();
  if(!text) return;
  sending = true;
  $('#btnSend').disabled = true;
  try{
    const r = await api(`/inbox/conversations/${activeId}/reply`, {method:'POST', body: JSON.stringify({text})});
    ta.value = ''; ta.style.height = 'auto';
    if(r.fallback) toast(`Аккаунт диалога недоступен — отправлено с ${r.account}`, true);
    lastMsgCount = 0;
    await loadThread(false);
    loadList();
  }catch(e){
    toast('Не отправлено: ' + e.message);
  }finally{
    sending = false;
    $('#btnSend').disabled = false;
  }
}

/* ── контролы ─────────────────────────────────────────────────────── */
$('#statusSeg').addEventListener('click', e => {
  const b = e.target.closest('button[data-s]');
  if(!b) return;
  statusFilter = b.dataset.s;
  [...$('#statusSeg').children].forEach(x => x.classList.toggle('active', x === b));
  loadList();
});
let searchDebounce;
$('#search').addEventListener('input', e => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => { search = e.target.value.trim(); loadList(); }, 300);
});

/* ── старт ────────────────────────────────────────────────────────── */
async function boot(){
  if(!await ensureToken()){ $('#tokenbox').style.display = 'flex'; return; }
  await loadList();
  clearInterval(listTimer);
  listTimer = setInterval(loadList, 8000);
}
boot();
</script>
</body>
</html>
